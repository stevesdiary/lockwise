name: Security Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Run weekly security scan every Monday at 9 AM
    - cron: '0 9 * * 1'

jobs:
  security-scan:
    name: Security Vulnerability Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: lockwise-server/package-lock.json
          
      - name: Install dependencies
        working-directory: lockwise-server
        run: npm ci
        
      - name: Run npm audit
        working-directory: lockwise-server
        run: |
          npm audit --audit-level=moderate || true
          npm audit --json > audit-report.json || true
          
      - name: Check for high/critical vulnerabilities
        working-directory: lockwise-server
        run: |
          HIGH_VULNS=$(npm audit --json | jq '.metadata.vulnerabilities.high // 0')
          CRITICAL_VULNS=$(npm audit --json | jq '.metadata.vulnerabilities.critical // 0')
          
          echo "High vulnerabilities: $HIGH_VULNS"
          echo "Critical vulnerabilities: $CRITICAL_VULNS"
          
          if [ "$CRITICAL_VULNS" -gt 0 ]; then
            echo "❌ Critical vulnerabilities found!"
            exit 1
          fi
          
          if [ "$HIGH_VULNS" -gt 5 ]; then
            echo "⚠️ Too many high vulnerabilities found!"
            exit 1
          fi
          
      - name: Run Secretlint
        working-directory: lockwise-server
        run: npx secretlint "**/*"
        continue-on-error: true
        
      - name: TypeScript type check
        working-directory: lockwise-server
        run: npx tsc --noEmit
        
      - name: Check for hardcoded secrets
        working-directory: lockwise-server
        run: |
          echo "Checking for hardcoded secrets..."
          
          # Check for common secret patterns
          if grep -r -i "password.*=.*['\"]" src/ --exclude-dir=node_modules --exclude="*.test.ts" | grep -v "password.*:.*string"; then
            echo "❌ Potential hardcoded password found!"
            exit 1
          fi
          
          if grep -r "api[_-]key.*=.*['\"][a-zA-Z0-9]" src/ --exclude-dir=node_modules --exclude="*.test.ts"; then
            echo "❌ Potential hardcoded API key found!"
            exit 1
          fi
          
          echo "✅ No hardcoded secrets detected"
          
      - name: Check environment variable usage
        working-directory: lockwise-server
        run: |
          echo "Checking for proper environment variable usage..."
          
          # Ensure sensitive env vars are not logged
          if grep -r "console.log.*process.env" src/ --exclude-dir=node_modules; then
            echo "⚠️ Warning: Environment variables being logged"
          fi
          
          echo "✅ Environment variable check complete"
          
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: security-audit-report
          path: lockwise-server/audit-report.json
          retention-days: 30

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Dependency Review
        uses: actions/dependency-review-action@v3
        with:
          fail-on-severity: high
          
  code-quality:
    name: Code Quality & Security Patterns
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Check for SQL injection patterns
        working-directory: lockwise-server
        run: |
          echo "Checking for potential SQL injection vulnerabilities..."
          
          # Check for string concatenation in queries
          if grep -r "sequelize.query.*\${" src/ --exclude-dir=node_modules --exclude="*.test.ts"; then
            echo "⚠️ Warning: Potential SQL injection via template literals"
          fi
          
          # Check for Sequelize.literal with variables
          if grep -r "Sequelize.literal.*\${" src/ --exclude-dir=node_modules --exclude="*.test.ts"; then
            echo "⚠️ Warning: Potential SQL injection via Sequelize.literal"
          fi
          
          echo "✅ SQL injection pattern check complete"
          
      - name: Check for XSS vulnerabilities
        working-directory: lockwise-server
        run: |
          echo "Checking for potential XSS vulnerabilities..."
          
          # Check for innerHTML usage
          if grep -r "innerHTML" src/ --exclude-dir=node_modules --exclude="*.test.ts"; then
            echo "⚠️ Warning: innerHTML usage detected"
          fi
          
          # Check for eval usage
          if grep -r "eval(" src/ --exclude-dir=node_modules --exclude="*.test.ts"; then
            echo "❌ eval() usage detected - security risk!"
            exit 1
          fi
          
          echo "✅ XSS pattern check complete"
          
      - name: Check authentication patterns
        working-directory: lockwise-server
        run: |
          echo "Checking authentication patterns..."
          
          # Check for Math.random() in security contexts
          if grep -r "Math.random()" src/modules/auth src/shared/utils --exclude-dir=node_modules --exclude="*.test.ts"; then
            echo "❌ Math.random() used in security context - use crypto.randomBytes()!"
            exit 1
          fi
          
          echo "✅ Authentication pattern check complete"
          
      - name: Check for rate limiting
        working-directory: lockwise-server
        run: |
          echo "Checking for rate limiting on routes..."
          
          # Ensure auth routes have rate limiting
          if ! grep -q "authRateLimiter" src/shared/core/index.ts; then
            echo "⚠️ Warning: Auth rate limiter not found in core"
          fi
          
          echo "✅ Rate limiting check complete"

  security-headers:
    name: Security Headers Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Check security headers configuration
        working-directory: lockwise-server
        run: |
          echo "Checking security headers configuration..."
          
          # Check for helmet usage
          if ! grep -q "helmet" src/shared/core/index.ts && ! grep -q "securityHeaders" src/shared/core/index.ts; then
            echo "❌ Security headers (helmet) not configured!"
            exit 1
          fi
          
          # Check for CORS configuration
          if ! grep -q "cors" src/shared/core/index.ts; then
            echo "❌ CORS not configured!"
            exit 1
          fi
          
          echo "✅ Security headers configured"

  notification:
    name: Security Scan Notification
    runs-on: ubuntu-latest
    needs: [security-scan, code-quality, security-headers]
    if: failure() && github.event_name == 'push'
    
    steps:
      - name: Send notification
        run: |
          echo "🚨 Security scan failed on ${{ github.ref }}"
          echo "Please review the security scan results and fix any issues."
          # Add Slack/email notification here if needed
