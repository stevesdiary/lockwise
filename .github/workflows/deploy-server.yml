name: Deploy Server

on:
  push:
    branches: [main]
    paths:
      - 'lockwise-server/**'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: lockwise-server/package-lock.json

      - name: Install & Build
        working-directory: lockwise-server
        run: |
          npm ci
          npm run build

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /var/www/lockwise-server
            git pull origin main
            npm ci --omit=dev
            npm run migrate
            pm2 restart lockwise-server || pm2 start build/src/main.js --name lockwise-server
