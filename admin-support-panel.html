<!DOCTYPE html>
<html>
<head>
    <title>Admin Support Panel</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background: #f5f5f5; }
        .container { max-width: 1200px; margin: 0 auto; }
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: white; padding: 20px; border-radius: 8px; text-align: center; }
        .stat-number { font-size: 2em; font-weight: bold; color: #007bff; }
        .filters { background: white; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        .filters select, .filters input { margin: 0 10px; padding: 8px; border: 1px solid #ddd; border-radius: 4px; }
        .ticket { background: white; border-radius: 8px; padding: 20px; margin-bottom: 15px; border-left: 4px solid #007bff; }
        .ticket.high { border-left-color: #dc3545; }
        .ticket.urgent { border-left-color: #fd7e14; }
        .ticket-header { display: flex; justify-content: between; align-items: center; margin-bottom: 10px; }
        .ticket-meta { font-size: 12px; color: #666; }
        .status { padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
        .status.open { background: #ffc107; color: #000; }
        .status.in_progress { background: #17a2b8; color: white; }
        .status.resolved { background: #28a745; color: white; }
        .status.closed { background: #6c757d; color: white; }
        button { background: #007bff; color: white; padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; margin: 2px; }
        button:hover { background: #0056b3; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); }
        .modal-content { background: white; margin: 50px auto; padding: 20px; width: 80%; max-width: 600px; border-radius: 8px; }
        .close { float: right; font-size: 28px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Support Ticket Management</h1>
        
        <div class="stats" id="stats">
            <div class="stat-card">
                <div class="stat-number" id="totalTickets">0</div>
                <div>Total Tickets</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="openTickets">0</div>
                <div>Open</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="inProgressTickets">0</div>
                <div>In Progress</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="resolvedTickets">0</div>
                <div>Resolved</div>
            </div>
        </div>

        <div class="filters">
            <select id="statusFilter" onchange="filterTickets()">
                <option value="">All Status</option>
                <option value="open">Open</option>
                <option value="in_progress">In Progress</option>
                <option value="resolved">Resolved</option>
                <option value="closed">Closed</option>
            </select>
            
            <select id="priorityFilter" onchange="filterTickets()">
                <option value="">All Priority</option>
                <option value="low">Low</option>
                <option value="medium">Medium</option>
                <option value="high">High</option>
                <option value="urgent">Urgent</option>
            </select>
            
            <input type="text" id="searchInput" placeholder="Search tickets..." onkeyup="searchTickets()">
            <button onclick="loadTickets()">Refresh</button>
        </div>

        <div id="ticketsList"></div>
    </div>

    <!-- Ticket Modal -->
    <div id="ticketModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <h2>Ticket Details</h2>
            <div id="ticketDetails"></div>
            <div>
                <h3>Actions</h3>
                <select id="statusSelect">
                    <option value="open">Open</option>
                    <option value="in_progress">In Progress</option>
                    <option value="resolved">Resolved</option>
                    <option value="closed">Closed</option>
                </select>
                <button onclick="updateTicketStatus()">Update Status</button>
                
                <h3>Add Message</h3>
                <textarea id="messageInput" rows="3" style="width: 100%; margin-bottom: 10px;"></textarea>
                <button onclick="addMessage()">Send Message</button>
            </div>
        </div>
    </div>

    <script>
        let currentTicketId = null;

        async function loadStats() {
            try {
                const response = await fetch('/api/admin/support/stats', {
                    headers: { 'Authorization': 'Bearer ' + localStorage.getItem('token') }
                });
                const data = await response.json();
                
                if (data.status === 'success') {
                    document.getElementById('totalTickets').textContent = data.data.totalTickets;
                    document.getElementById('openTickets').textContent = data.data.openTickets;
                    document.getElementById('inProgressTickets').textContent = data.data.inProgressTickets;
                    document.getElementById('resolvedTickets').textContent = data.data.resolvedTickets;
                }
            } catch (error) {
                console.error('Error loading stats:', error);
            }
        }

        async function loadTickets() {
            try {
                const response = await fetch('/api/admin/support/tickets', {
                    headers: { 'Authorization': 'Bearer ' + localStorage.getItem('token') }
                });
                const data = await response.json();
                
                if (data.status === 'success') {
                    displayTickets(data.data.tickets);
                }
            } catch (error) {
                console.error('Error loading tickets:', error);
            }
        }

        function displayTickets(tickets) {
            const container = document.getElementById('ticketsList');
            
            if (tickets.length === 0) {
                container.innerHTML = '<p>No tickets found.</p>';
                return;
            }

            container.innerHTML = tickets.map(ticket => `
                <div class="ticket ${ticket.priority}" onclick="openTicketModal('${ticket.id}')">
                    <div class="ticket-header">
                        <h3>${ticket.subject}</h3>
                        <span class="status ${ticket.status}">${ticket.status.replace('_', ' ').toUpperCase()}</span>
                    </div>
                    <p>${ticket.description.substring(0, 150)}...</p>
                    <div class="ticket-meta">
                        <strong>User:</strong> ${ticket.user.first_name} ${ticket.user.last_name} |
                        <strong>Category:</strong> ${ticket.category} |
                        <strong>Priority:</strong> ${ticket.priority} |
                        <strong>Created:</strong> ${new Date(ticket.created_at).toLocaleString()}
                    </div>
                </div>
            `).join('');
        }

        async function filterTickets() {
            const status = document.getElementById('statusFilter').value;
            const priority = document.getElementById('priorityFilter').value;
            
            let url = '/api/admin/support/tickets?';
            if (status) url += `status=${status}&`;
            if (priority) url += `priority=${priority}&`;

            try {
                const response = await fetch(url, {
                    headers: { 'Authorization': 'Bearer ' + localStorage.getItem('token') }
                });
                const data = await response.json();
                
                if (data.status === 'success') {
                    displayTickets(data.data.tickets);
                }
            } catch (error) {
                console.error('Error filtering tickets:', error);
            }
        }

        async function searchTickets() {
            const query = document.getElementById('searchInput').value;
            
            if (query.length < 3) {
                loadTickets();
                return;
            }

            try {
                const response = await fetch(`/api/admin/support/search?query=${encodeURIComponent(query)}`, {
                    headers: { 'Authorization': 'Bearer ' + localStorage.getItem('token') }
                });
                const data = await response.json();
                
                if (data.status === 'success') {
                    displayTickets(data.data);
                }
            } catch (error) {
                console.error('Error searching tickets:', error);
            }
        }

        function openTicketModal(ticketId) {
            currentTicketId = ticketId;
            document.getElementById('ticketModal').style.display = 'block';
            // Load ticket details here
        }

        function closeModal() {
            document.getElementById('ticketModal').style.display = 'none';
            currentTicketId = null;
        }

        async function updateTicketStatus() {
            if (!currentTicketId) return;
            
            const status = document.getElementById('statusSelect').value;
            
            try {
                const response = await fetch(`/api/admin/support/tickets/${currentTicketId}/status`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + localStorage.getItem('token')
                    },
                    body: JSON.stringify({ status })
                });

                if (response.ok) {
                    alert('Status updated successfully');
                    closeModal();
                    loadTickets();
                    loadStats();
                }
            } catch (error) {
                console.error('Error updating status:', error);
            }
        }

        async function addMessage() {
            if (!currentTicketId) return;
            
            const message = document.getElementById('messageInput').value;
            if (!message.trim()) return;
            
            try {
                const response = await fetch(`/api/admin/support/tickets/${currentTicketId}/messages`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + localStorage.getItem('token')
                    },
                    body: JSON.stringify({ message })
                });

                if (response.ok) {
                    document.getElementById('messageInput').value = '';
                    alert('Message sent successfully');
                }
            } catch (error) {
                console.error('Error sending message:', error);
            }
        }

        // Load initial data
        window.onload = () => {
            loadStats();
            loadTickets();
        };
    </script>
</body>
</html>
